<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Blog Posts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>
    <div class="p-5 mb-5 text-center bg-light">
        <h1 class="mb-3">My Blog</h1>
        <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
    </div>
    <div class="container mb-5" style="max-width: 900px;">   <!-- 너무 넓지 않게 폭 제한 -->
        <a th:href="@{/new-article}" class="btn btn-success btn-sm mb-3">글등록</a>
        <a th:href="@{/}" class="btn btn-secondary btn-sm mb-3">홈으로</a>
        <div class="row row-cols-1 g-4">
            <div class="col" th:each="item : ${articles}">
                <div class="card h-100">
                    <div class="card-header" th:text="${item.id}"></div>
                    <img th:if="${item.imageUrl != null and item.imageUrl != ''}"
                         th:src="${item.imageUrl}"
                         class="card-img-top"
                         alt="게시글 이미지"
                         style="max-height: 300px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${item.title}"></h5>
                        <p class="card-text" th:text="${item.content}"></p>
                        <a th:href="@{/articles/{id}(id=${item.id})}"
                           class="btn btn-primary">보러 가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap 5.1.3 JS (Popper 포함) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
