<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body class="bg-light">
    <!-- 소개 영역 -->
    <div class="container py-5">
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm text-center">
            <h1 class="display-5 fw-bold mb-3">Blog Project</h1>
            <p class="fs-5 text-muted mb-4">
                Spring Boot · Spring Data JPA · Thymeleaf로 만든 블로그입니다.<br>
                글을 읽고, 쓰고, 수정해 보세요.
            </p>
            <a th:href="@{/articles}" class="btn btn-primary btn-lg px-4 me-2">블로그 바로가기</a>
            <a th:href="@{/new-article}" class="btn btn-outline-secondary btn-lg px-4">새 글 쓰기</a>
        </div>

        <!-- 바로가기 카드 -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">📋 글 목록</h5>
                        <p class="card-text text-muted">등록된 블로그 글을 카드로 봅니다.</p>
                        <a th:href="@{/articles}" class="btn btn-sm btn-primary">이동</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">✏️ 글 등록</h5>
                        <p class="card-text text-muted">제목과 내용을 입력해 새 글을 씁니다.</p>
                        <a th:href="@{/new-article}" class="btn btn-sm btn-primary">이동</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">🔗 REST API</h5>
                        <p class="card-text text-muted">글 목록을 JSON으로 확인합니다.</p>
                        <a th:href="@{/api/articles}" class="btn btn-sm btn-outline-primary">GET /api/articles</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.1.3 JS (Popper 포함) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
