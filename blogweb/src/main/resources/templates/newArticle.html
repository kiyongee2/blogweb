<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Blog Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>
    <div class="p-5 mb-5 text-center bg-light">
        <h1 class="mb-3">My Blog</h1>
        <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
    </div>
    <div class="container mb-5" style="max-width: 900px;">   <!-- 너무 넓지 않게 폭 제한 -->
        <!-- 목록 화면의 "글 등록" 버튼과 같은 자리 -->
        <a th:href="@{/articles}" class="btn btn-secondary btn-sm mb-3">← 글목록</a>

        <!-- 목록 화면과 같은 카드 모양 -->
        <div class="card">
            <div class="card-header" th:text="${article.id == null} ? '새 글 쓰기' : '글 수정'"></div>
            <div class="card-body">
                <!-- 아이디 정보 저장 -->
                <input type="hidden" id="article-id" th:value="${article.id}">

                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" class="form-control" placeholder="제목" id="title"
                           th:value="${article.title}">
                </div>

                <div class="mb-3">
                    <label for="image-upload" class="form-label">이미지 업로드</label>
                    <input type="file" class="form-control" id="image-upload" accept="image/*">
                    <input type="hidden" id="image-url" th:value="${article.imageUrl}">
                    <div id="image-preview" class="mt-3" style="display: none;">
                        <img src="" alt="미리보기" id="preview-img" class="img-fluid rounded"
                             style="max-height: 300px;">
                        <div>
                            <button type="button" id="remove-image-btn"
                                    class="btn btn-sm btn-danger mt-2">이미지 제거</button>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">내용</label>
                    <textarea class="form-control" rows="10" placeholder="내용"
                              id="content" th:text="${article.content}"></textarea>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-end gap-2">
                <button type="button" id="ai-assist-btn"
                        class="btn btn-info btn-sm">AI 도움받기</button>
                <button type="button" th:if="${article.id} != null" id="modify-btn"
                        class="btn btn-primary btn-sm">수정</button>
                <button type="button" th:if="${article.id} == null" id="create-btn"
                        class="btn btn-primary btn-sm">등록</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.1.3 JS (Popper 포함) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <!-- 등록 · 수정 버튼 동작 -->
    <script src="/js/article.js"></script>
</body>
</html>
